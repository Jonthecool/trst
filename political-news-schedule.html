<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Live Political News</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #0f172a;
      border-bottom: 2px solid #e63946;
      padding: 0.85rem 1rem 0;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 2px 16px rgba(0,0,0,0.6);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-dot {
      width: 10px; height: 10px;
      background: #e63946;
      border-radius: 50%;
      animation: pulse 1.4s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(0.85); }
    }

    .logo h1 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: #f1f5f9;
    }

    .header-meta {
      font-size: 0.65rem;
      color: #64748b;
      text-align: right;
      line-height: 1.5;
    }

    #last-updated { color: #94a3b8; }

    /* ── Source tabs ── */
    .tabs {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      padding-bottom: 0.6rem;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex-shrink: 0;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      border: 1px solid #334155;
      color: #94a3b8;
      background: transparent;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .tab.active, .tab:active {
      background: #e63946;
      border-color: #e63946;
      color: white;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 1rem;
      border-bottom: 1px solid #1e293b;
    }

    .count { font-size: 0.72rem; color: #64748b; }
    .count span { color: #94a3b8; font-weight: 600; }

    #refresh-btn {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #94a3b8;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.35rem 0.7rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    #refresh-btn:active { background: #334155; }
    #refresh-btn svg { transition: transform 0.4s; }
    #refresh-btn.spinning svg { transform: rotate(360deg); }

    /* ── Feed container ── */
    #feed {
      padding: 0.6rem 0.75rem 2rem;
    }

    /* ── Article card ── */
    .article {
      display: block;
      text-decoration: none;
      color: inherit;
      background: #1e293b;
      border-radius: 12px;
      margin-bottom: 0.6rem;
      overflow: hidden;
      border: 1px solid #293548;
      transition: transform 0.12s, border-color 0.12s;
    }

    .article:active { transform: scale(0.985); border-color: #475569; }

    .article-inner {
      display: flex;
      gap: 0;
    }

    .article-thumb {
      width: 90px;
      min-width: 90px;
      height: 90px;
      object-fit: cover;
      background: #0f172a;
    }

    .article-thumb-placeholder {
      width: 90px;
      min-width: 90px;
      height: 90px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
    }

    .article-content {
      flex: 1;
      padding: 0.65rem 0.75rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .article-source-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.3rem;
    }

    .source-badge {
      font-size: 0.6rem;
      font-weight: 700;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .article-age {
      font-size: 0.6rem;
      color: #475569;
    }

    .article-title {
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.35;
      color: #e2e8f0;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── Skeleton loaders ── */
    .skeleton {
      background: #1e293b;
      border-radius: 12px;
      margin-bottom: 0.6rem;
      height: 90px;
      overflow: hidden;
      position: relative;
    }

    .skeleton::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.04) 50%, transparent 100%);
      animation: shimmer 1.4s infinite;
    }

    @keyframes shimmer {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* ── Error / empty ── */
    .status-msg {
      text-align: center;
      padding: 2.5rem 1.5rem;
      color: #475569;
      font-size: 0.82rem;
      line-height: 1.6;
    }

    .status-msg .icon { font-size: 2rem; margin-bottom: 0.5rem; }

    /* ── Source color map ── */
    .src-npr       { background: #7c3aed; color: #fff; }
    .src-apnews    { background: #c2410c; color: #fff; }
    .src-politico  { background: #1d4ed8; color: #fff; }
    .src-thehill   { background: #0f766e; color: #fff; }
    .src-reuters   { background: #b45309; color: #fff; }
    .src-foxnews   { background: #1e40af; color: #fff; }
    .src-cnn       { background: #dc2626; color: #fff; }
    .src-nbc       { background: #059669; color: #fff; }

    @media (min-width: 520px) {
      #feed { padding: 0.75rem 1.25rem 2rem; }
      .article-thumb, .article-thumb-placeholder { width: 110px; min-width: 110px; height: 100px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo">
      <div class="logo-dot"></div>
      <h1>Live Political News</h1>
    </div>
    <div class="header-meta">
      <div id="today-date"></div>
      <div id="last-updated">Loading…</div>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-src="all">All</button>
    <button class="tab" data-src="apnews">AP News</button>
    <button class="tab" data-src="politico">Politico</button>
    <button class="tab" data-src="thehill">The Hill</button>
    <button class="tab" data-src="npr">NPR</button>
    <button class="tab" data-src="reuters">Reuters</button>
    <button class="tab" data-src="foxnews">Fox News</button>
  </div>
</header>

<div class="toolbar">
  <div class="count">Showing <span id="article-count">—</span> stories</div>
  <button id="refresh-btn" onclick="loadAll()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
    </svg>
    Refresh
  </button>
</div>

<div id="feed"></div>

<script>
// ─── Source config ──────────────────────────────────────────────────────────
const SOURCES = [
  {
    id: 'apnews',
    label: 'AP News',
    cls: 'src-apnews',
    icon: '🗞',
    url: 'https://feeds.apnews.com/rss/apf-politics',
  },
  {
    id: 'politico',
    label: 'Politico',
    cls: 'src-politico',
    icon: '🏛',
    url: 'https://www.politico.com/rss/politico44.xml',
  },
  {
    id: 'thehill',
    label: 'The Hill',
    cls: 'src-thehill',
    icon: '📋',
    url: 'https://thehill.com/news/feed/',
  },
  {
    id: 'npr',
    label: 'NPR Politics',
    cls: 'src-npr',
    icon: '🎙',
    url: 'https://feeds.npr.org/1014/rss.xml',
  },
  {
    id: 'reuters',
    label: 'Reuters',
    cls: 'src-reuters',
    icon: '📡',
    url: 'https://feeds.reuters.com/Reuters/PoliticsNews',
  },
  {
    id: 'foxnews',
    label: 'Fox News',
    cls: 'src-foxnews',
    icon: '📺',
    url: 'https://feeds.foxnews.com/foxnews/politics',
  },
];

const RSS2JSON = 'https://api.rss2json.com/v1/api.json?rss_url=';
let allArticles = [];
let activeFilter = 'all';

// ─── Fetch one feed ──────────────────────────────────────────────────────────
async function fetchFeed(source) {
  try {
    const res = await fetch(RSS2JSON + encodeURIComponent(source.url), { cache: 'no-store' });
    if (!res.ok) return [];
    const data = await res.json();
    if (data.status !== 'ok' || !data.items) return [];
    return data.items.slice(0, 12).map(item => ({
      source: source,
      title: item.title || '',
      link: item.link || item.guid || '#',
      pubDate: item.pubDate ? new Date(item.pubDate) : null,
      thumb: extractImage(item),
    }));
  } catch {
    return [];
  }
}

function extractImage(item) {
  if (item.thumbnail && item.thumbnail.startsWith('http')) return item.thumbnail;
  if (item.enclosure && item.enclosure.link) return item.enclosure.link;
  const m = (item.content || item.description || '').match(/src=["']([^"']+\.(jpg|jpeg|png|webp)[^"']*)/i);
  return m ? m[1] : null;
}

// ─── Render ──────────────────────────────────────────────────────────────────
function timeAgo(date) {
  if (!date) return '';
  const mins = Math.floor((Date.now() - date) / 60000);
  if (mins < 1)  return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24)  return `${hrs}h ago`;
  return `${Math.floor(hrs/24)}d ago`;
}

function renderArticles(articles) {
  const feed = document.getElementById('feed');
  if (!articles.length) {
    feed.innerHTML = `
      <div class="status-msg">
        <div class="icon">📭</div>
        No stories found for this source.<br>Try refreshing or choosing another tab.
      </div>`;
    document.getElementById('article-count').textContent = '0';
    return;
  }

  document.getElementById('article-count').textContent = articles.length;

  feed.innerHTML = articles.map(a => `
    <a class="article" href="${a.link}" target="_blank" rel="noopener">
      <div class="article-inner">
        ${a.thumb
          ? `<img class="article-thumb" src="${a.thumb}" alt="" loading="lazy" onerror="this.style.display='none'">`
          : `<div class="article-thumb-placeholder">${a.source.icon}</div>`
        }
        <div class="article-content">
          <div class="article-source-row">
            <span class="source-badge ${a.source.cls}">${a.source.label}</span>
            <span class="article-age">${timeAgo(a.pubDate)}</span>
          </div>
          <div class="article-title">${escHtml(a.title)}</div>
        </div>
      </div>
    </a>
  `).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showSkeletons() {
  document.getElementById('feed').innerHTML =
    Array(7).fill('<div class="skeleton"></div>').join('');
}

// ─── Load all feeds ──────────────────────────────────────────────────────────
async function loadAll() {
  showSkeletons();
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');

  const results = await Promise.allSettled(SOURCES.map(fetchFeed));
  allArticles = results
    .flatMap(r => r.status === 'fulfilled' ? r.value : [])
    .sort((a, b) => (b.pubDate || 0) - (a.pubDate || 0));

  const now = new Date();
  document.getElementById('last-updated').textContent =
    'Updated ' + now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

  applyFilter();
  btn.classList.remove('spinning');
}

function applyFilter() {
  const visible = activeFilter === 'all'
    ? allArticles
    : allArticles.filter(a => a.source.id === activeFilter);
  renderArticles(visible);
}

// ─── Tabs ────────────────────────────────────────────────────────────────────
document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  activeFilter = tab.dataset.src;
  applyFilter();
});

// ─── Init ────────────────────────────────────────────────────────────────────
const d = new Date();
document.getElementById('today-date').textContent =
  d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });

loadAll();

// Auto-refresh every 5 minutes
setInterval(loadAll, 5 * 60 * 1000);
</script>

</body>
</html>
