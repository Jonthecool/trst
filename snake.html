<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f1a;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100dvh;
      padding: 12px 8px;
      touch-action: none;
      overscroll-behavior: none;
    }

    h1 {
      font-size: 1.6rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #4ade80;
      margin-bottom: 8px;
      text-shadow: 0 0 12px #4ade8066;
    }

    #scoreboard {
      display: flex;
      gap: 32px;
      margin-bottom: 10px;
      font-size: 0.9rem;
      color: #a0a0b0;
    }

    #scoreboard span { color: #fff; font-weight: bold; }

    #canvas-wrap {
      position: relative;
      border: 2px solid #4ade8044;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 24px #4ade8022;
    }

    canvas { display: block; }

    #overlay {
      position: absolute;
      inset: 0;
      background: #0f0f1acc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      backdrop-filter: blur(3px);
    }

    #overlay.hidden { display: none; }

    #overlay h2 {
      font-size: 1.8rem;
      color: #4ade80;
      text-shadow: 0 0 16px #4ade8088;
    }

    #overlay p { color: #a0a0b0; font-size: 0.95rem; }

    #overlay .final-score { font-size: 1.1rem; color: #fff; }

    button {
      background: #4ade80;
      color: #0f0f1a;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { background: #22c55e; }

    /* D-pad controls */
    #dpad {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(3, 56px);
      gap: 4px;
      margin-top: 14px;
    }

    .dpad-btn {
      background: #1e1e30;
      border: 1px solid #4ade8044;
      border-radius: 10px;
      color: #4ade80;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
    }

    .dpad-btn:active, .dpad-btn.pressed { background: #2d2d45; }
    .dpad-center { background: transparent; border-color: transparent; cursor: default; }
  </style>
</head>
<body>
  <h1>Snake</h1>

  <div id="scoreboard">
    Score: <span id="score">0</span>&nbsp;&nbsp;&nbsp;Best: <span id="best">0</span>
  </div>

  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">Snake</h2>
      <p id="overlay-msg">Swipe or use the D-pad to move</p>
      <p id="final-score" class="final-score" style="display:none"></p>
      <button id="start-btn">Play</button>
    </div>
  </div>

  <div id="dpad">
    <div></div>
    <div class="dpad-btn" id="btn-up">▲</div>
    <div></div>
    <div class="dpad-btn" id="btn-left">◀</div>
    <div class="dpad-center"></div>
    <div class="dpad-btn" id="btn-right">▶</div>
    <div></div>
    <div class="dpad-btn" id="btn-down">▼</div>
    <div></div>
  </div>

<script>
(function () {
  const CELL = 20;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayMsg = document.getElementById('overlay-msg');
  const finalScoreEl = document.getElementById('final-score');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const startBtn = document.getElementById('start-btn');

  let COLS, ROWS, snake, dir, nextDir, food, score, best, raf, lastTime, speed, running;

  function resize() {
    const maxW = Math.min(window.innerWidth - 16, 400);
    const maxH = Math.min(window.innerHeight - 260, 400);
    COLS = Math.floor(maxW / CELL);
    ROWS = Math.floor(maxH / CELL);
    canvas.width  = COLS * CELL;
    canvas.height = ROWS * CELL;
    if (!running) draw();
  }

  function init() {
    const mid = { x: Math.floor(COLS / 2), y: Math.floor(ROWS / 2) };
    snake = [mid, { x: mid.x - 1, y: mid.y }, { x: mid.x - 2, y: mid.y }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    speed = 150;
    scoreEl.textContent = 0;
    placeFood();
  }

  function placeFood() {
    const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
    let f;
    do { f = { x: rnd(COLS), y: rnd(ROWS) }; } while (occupied.has(`${f.x},${f.y}`));
    food = f;
  }

  function rnd(n) { return Math.floor(Math.random() * n); }

  function step(ts) {
    raf = requestAnimationFrame(step);
    if (!lastTime) { lastTime = ts; return; }
    if (ts - lastTime < speed) return;
    lastTime = ts;

    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
    if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      if (score > best) { best = score; bestEl.textContent = best; }
      speed = Math.max(60, 150 - score * 4);
      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function draw() {
    ctx.fillStyle = '#0f0f1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid dots
    ctx.fillStyle = '#1e1e2e';
    for (let x = 0; x < COLS; x++) {
      for (let y = 0; y < ROWS; y++) {
        ctx.fillRect(x * CELL + CELL / 2 - 1, y * CELL + CELL / 2 - 1, 2, 2);
      }
    }

    // Food
    const fx = food.x * CELL + CELL / 2;
    const fy = food.y * CELL + CELL / 2;
    ctx.save();
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#f87171';
    ctx.fillStyle = '#f87171';
    ctx.beginPath();
    ctx.arc(fx, fy, CELL / 2 - 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Snake
    snake.forEach((s, i) => {
      const t = 1 - i / snake.length;
      ctx.save();
      ctx.shadowBlur = i === 0 ? 10 : 0;
      ctx.shadowColor = '#4ade80';
      ctx.fillStyle = i === 0 ? '#4ade80' : `rgba(74,222,128,${0.3 + t * 0.6})`;
      const pad = i === 0 ? 2 : 3;
      roundRect(ctx, s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 4);
      ctx.restore();
    });
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function gameOver() {
    cancelAnimationFrame(raf);
    running = false;
    overlayTitle.textContent = 'Game Over';
    overlayMsg.style.display = 'none';
    finalScoreEl.style.display = 'block';
    finalScoreEl.textContent = `Score: ${score}`;
    startBtn.textContent = 'Play Again';
    overlay.classList.remove('hidden');
  }

  function startGame() {
    overlay.classList.add('hidden');
    overlayMsg.style.display = 'block';
    finalScoreEl.style.display = 'none';
    resize();
    init();
    running = true;
    lastTime = 0;
    raf = requestAnimationFrame(step);
  }

  // Input: keyboard
  const KEYS = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
                 w:[0,-1], s:[0,1], a:[-1,0], d:[1,0] };
  document.addEventListener('keydown', e => {
    const d = KEYS[e.key];
    if (d && running) {
      if (d[0] !== -dir.x || d[1] !== -dir.y) nextDir = { x: d[0], y: d[1] };
      e.preventDefault();
    }
  });

  // Input: touch swipe
  let tx0, ty0;
  canvas.addEventListener('touchstart', e => { tx0 = e.touches[0].clientX; ty0 = e.touches[0].clientY; }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!running) return;
    const dx = e.changedTouches[0].clientX - tx0;
    const dy = e.changedTouches[0].clientY - ty0;
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    let d;
    if (Math.abs(dx) > Math.abs(dy)) d = dx > 0 ? [1,0] : [-1,0];
    else d = dy > 0 ? [0,1] : [0,-1];
    if (d[0] !== -dir.x || d[1] !== -dir.y) nextDir = { x: d[0], y: d[1] };
  }, { passive: true });

  // Input: D-pad buttons
  function dpadPress(dx, dy) {
    if (!running) return;
    if (dx !== -dir.x || dy !== -dir.y) nextDir = { x: dx, y: dy };
  }

  function bindBtn(id, dx, dy) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); el.classList.add('pressed'); dpadPress(dx, dy); }, { passive: false });
    el.addEventListener('touchend',   e => { e.preventDefault(); el.classList.remove('pressed'); }, { passive: false });
    el.addEventListener('mousedown',  () => dpadPress(dx, dy));
  }

  bindBtn('btn-up',    0, -1);
  bindBtn('btn-down',  0,  1);
  bindBtn('btn-left', -1,  0);
  bindBtn('btn-right', 1,  0);

  startBtn.addEventListener('click', startGame);

  best = parseInt(localStorage.getItem('snake-best') || '0');
  bestEl.textContent = best;

  // Persist best score
  const origGameOver = gameOver;
  window.addEventListener('beforeunload', () => localStorage.setItem('snake-best', best));

  window.addEventListener('resize', () => { resize(); });
  resize();
  draw();
})();
</script>
</body>
</html>
